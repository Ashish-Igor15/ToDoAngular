<section class="auth-shell">
  <div class="card auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to continue managing your tasks.</p>

    <form class="auth-form" (ngSubmit)="loginUser()" #loginForm="ngForm">
      <label for="email">Email</label>
      <input id="email" type="email" class="input" [(ngModel)]="loginUserData.email" name="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" class="input" [(ngModel)]="loginUserData.password" name="password" required>

      <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Login</button>
    </form>
  </div>
</section>
