<section class="auth-shell">
  <div class="card auth-card">
    <h2>Create account</h2>
    <p class="subtitle">Sign up once and manage todos from anywhere.</p>

    <form class="auth-form" (ngSubmit)="registerUser()" #registerForm="ngForm">
      <label for="register-email">Email</label>
      <input id="register-email" type="email" [(ngModel)]="registerUserData.email" name="email" class="input" required>

      <label for="register-password">Password</label>
      <input id="register-password" type="password" [(ngModel)]="registerUserData.password" name="password" class="input" required minlength="8">
      <small class="hint">Use at least 8 characters.</small>

      <p class="text-success" *ngIf="message">{{ message }}</p>
      <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">Register</button>
    </form>
  </div>
</section>
